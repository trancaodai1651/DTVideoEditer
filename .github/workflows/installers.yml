name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            artifact: windows-x64-setup
            files: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: macos-universal-dmg
            files: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS'
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Package offline background removal
        run: python scripts/package-rembg.py
      - name: Package Whisper caption model
        run: python scripts/package-whisper.py
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --config src-tauri/target/rembg.bundle.json ${{ matrix.args }}
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Video Studio.app"
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -archs "$app/Contents/MacOS/$binary"
          lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          hdiutil verify apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - if: runner.os == 'macOS'
        name: Smoke test packaged macOS app
        shell: bash
        run: |
          app="$PWD/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Video Studio.app"
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          log="$RUNNER_TEMP/dt-edit-macos-startup.log"
          "$app/Contents/MacOS/$binary" > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            exit 1
          fi
          echo "Packaged application started and stayed running on $(uname -m)."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
