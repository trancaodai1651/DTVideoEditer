name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm context:check
      - run: pnpm skills:check
      - run: pnpm build
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo +stable test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
