[package]
name = "ai-video-studio"
version = "0.11.0"
description = "Local-first desktop media workspace"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
http-range = "0.1"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "multipart", "native-tls", "query", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tempfile = "3"
wait-timeout = "0.2"
walkdir = "2"

[dev-dependencies]
quick-xml = "0.42"
